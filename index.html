<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/music.png">
    <link rel="manifest" href="manifest.json">
    <title>MUSIC APP WITH MY FRIEND | BY NMT</title>
</head>
<body>

    <!-- Backgrounds -->
    <video autoplay muted loop playsinline class="background-video" id="main-video">
        <source src="" type="video/mp4" id="video-source">
    </video>
    <img src="assets/1.jpg" class="background-img" id="main-bg" alt="Background">

    <!-- Overlays -->
    <div class="bg-overlay"></div>
    <canvas id="particle-canvas"></canvas>

    <!-- Toast Notifications -->
    <div id="zen-toast">Hiding UI in 5s...</div>
    <div id="toast-container"></div>

    <div class="app-layout">
        
        <!-- Sidebar Drawer -->
        <div class="side-playlist" id="playlist-drawer">
            <div class="drawer-header">
                <h3>TrackList</h3>
            </div>
            
            <div class="filter-tabs">
                <button class="tab-btn active" data-tab="all" title="All Tracks"><i class="fa-solid fa-music"></i></button>
                <button class="tab-btn" data-tab="fav" title="Favorites"><i class="fa-solid fa-heart"></i></button>
                <button class="tab-btn" data-tab="history" title="Recently Played"><i class="fa-solid fa-clock-rotate-left"></i></button>
                <button class="tab-btn" data-tab="settings" title="Settings"><i class="fa-solid fa-sliders"></i></button>
            </div>

            <!-- Search Box -->
            <div class="search-box" id="search-box">
                <input type="text" id="search-input" placeholder="Search songs, artists...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <!-- Content Tabs -->
            <div class="playlist-container active" id="playlist-content"></div>
            <div class="playlist-container" id="history-content"></div>

            <!-- Settings -->
            <div class="settings-container" id="settings-content">
                
                <!-- Install App Button (PWA) -->
                <h4 style="margin-top: 0;"><i class="fa-solid fa-download"></i> App Installation</h4>
                <div class="setting-group" style="margin-top: 10px; margin-bottom: 20px;">
                    <button class="setting-btn action-btn" id="install-app-btn" style="width: 100%; font-weight: 600;">Install MUSIC APP</button>
                </div>

                <!-- Mood Themes -->
                <h4><i class="fa-solid fa-palette"></i> Mood Themes</h4>
                <div class="setting-group mood-grid">
                    <button class="setting-btn theme-btn active" data-theme="auto">Auto</button>
                    <button class="setting-btn theme-btn" data-theme="midnight">Midnight</button>
                    <button class="setting-btn theme-btn" data-theme="sunset">Sunset</button>
                    <button class="setting-btn theme-btn" data-theme="forest">Forest</button>
                    <button class="setting-btn theme-btn" data-theme="neon">Neon</button>
                    <button class="setting-btn theme-btn" data-theme="ocean">Ocean</button>
                    <button class="setting-btn theme-btn" data-theme="cherry">Cherry</button>
                    <button class="setting-btn theme-btn" data-theme="coffee">Coffee</button>
                    <button class="setting-btn theme-btn" data-theme="mono">Mono</button>
                </div>

                <!-- Particle Switcher -->
                <h4 style="margin-top: 25px;"><i class="fa-solid fa-wand-magic-sparkles"></i> Particles</h4>
                <div class="setting-group timer-grid" style="grid-template-columns: repeat(3, 1fr);">
                    <button class="setting-btn particle-btn" data-particle="fireflies">Fireflies</button>
                    <button class="setting-btn particle-btn" data-particle="rain">Rain</button>
                    <button class="setting-btn particle-btn" data-particle="snow">Snow</button>
                </div>

                <!-- Sleep Timer -->
                <h4 style="margin-top: 25px;"><i class="fa-solid fa-stopwatch"></i> Sleep Timer</h4>
                <div class="setting-group timer-grid">
                    <button class="setting-btn timer-btn active" data-time="0">Off</button>
                    <button class="setting-btn timer-btn" data-time="1">1m</button>
                    <button class="setting-btn timer-btn" data-time="5">5m</button>
                    <button class="setting-btn timer-btn" data-time="10">10m</button>
                    <button class="setting-btn timer-btn" data-time="15">15m</button>
                    <button class="setting-btn timer-btn" data-time="20">20m</button>
                    <button class="setting-btn timer-btn" data-time="25">25m</button>
                    <button class="setting-btn timer-btn" data-time="30">30m</button>
                    <button class="setting-btn timer-btn" data-time="60" style="grid-column: span 4;">60 Minutes</button>
                </div>
                <div id="timer-display" class="timer-status">Timer: Off</div>

                <!-- Custom Background -->
                <h4 style="margin-top: 25px;"><i class="fa-solid fa-image"></i> Custom Background</h4>
                <div class="search-box" style="padding: 0; margin-bottom: 12px;">
                    <input type="text" class="custom-input" id="custom-bg-input" placeholder="Paste image/video link...">
                </div>
                
                <input type="file" id="custom-bg-upload" accept="image/*" style="display: none;">
                
                <div class="setting-group" style="display: flex; gap: 8px;">
                    <button class="setting-btn action-btn" id="apply-bg-btn" style="flex: 1.2;" title="Paste Link">Link</button>
                    <button class="setting-btn action-btn" id="upload-bg-btn" style="flex: 1.5;" title="Upload File"><i class="fa-solid fa-upload"></i> Upload</button>
                    <button class="setting-btn danger-btn" id="reset-bg-btn" style="flex: 1;" title="Reset Background">Reset</button>
                </div>
            </div>
        </div>

        <!-- Main Player (Giao diện phẳng chuẩn mực, không lỗi chữ) -->
        <div class="glass-player" id="glass-player">
            <div class="top-row">
                <div class="top-left">
                    <i class="fa-solid fa-list-ul" id="playlist-toggle-btn" title="Toggle Tracklist"></i>
                </div>
                <div class="top-center">
                    <span class="app-brand">CHILL & RELAX</span>
                </div>
                <div class="top-right">
                    <span id="track-count">TRACK 1 OF 24</span>
                </div>
            </div>
            
            <div class="center-info">
                <div class="modern-cd" id="cd-element">
                    <div class="cd-hole"></div>
                </div>
                <h1 class="song-title" id="music-title">Song Title</h1>
                <div class="artist" id="music-artist">Artist Name</div>
                
                <div class="visualizer" id="visualizer-bars">
                    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="bottom-area">
                <div class="player-progress-container">
                    <span id="current-time">0:00</span>
                    <div class="player-progress" id="player-progress">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>

                <div class="controls-row">
                    <div class="main-controls">
                        <i class="fa-solid fa-shuffle" id="shuffle" title="Shuffle"></i>
                        <i class="fa-solid fa-backward-step" id="prev" title="Previous"></i>
                        <div class="play-btn-wrapper" id="play-btn-wrapper">
                            <i class="fa-solid fa-play" id="play" title="Play"></i>
                        </div>
                        <i class="fa-solid fa-forward-step" id="next" title="Next"></i>
                        <i class="fa-solid fa-repeat" id="repeat" title="Repeat (L)"></i>
                    </div>
                    
                    <div class="volume-control">
                        <i class="fa-solid fa-volume-high" id="volume-icon" title="Mute/Unmute (M)"></i>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
