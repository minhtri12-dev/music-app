<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/music.png">
    <title>MUSIC APP WITH MY FRIEND | BY NMT</title>
</head>

<body>

    <div class="background">
        <img src="" id="bg-img">
    </div>

    <div class="player-wrapper">
        <!-- Drawer Danh sách phát -->
        <div class="playlist-drawer" id="playlist-drawer">
            <div class="drawer-header">
                <h3>Thư viện & Kho nhạc</h3>
                <i class="fa-solid fa-xmark" id="close-playlist"></i>
            </div>
            
            <div class="profile-switcher">
                <span>User:</span>
                <div class="profile-buttons">
                    <button class="profile-btn active" data-user="tri">Trí</button>
                    <button class="profile-btn" data-user="khanh">Khánh Piggy</button>
                    <button class="profile-btn" data-user="user">User</button>
                </div>
            </div>

            <div class="playlist-toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Tìm bài hát, ca sĩ...">
                </div>
                <div class="filter-tabs">
                    <button class="tab-btn active" data-tab="all">Tất cả</button>
                    <button class="tab-btn" data-tab="fav"><i class="fa-solid fa-heart"></i> Đã thích</button>
                    <button class="tab-btn" data-tab="queue"><i class="fa-solid fa-list-ol"></i> Hàng đợi</button>
                </div>
            </div>
            <div class="drawer-content" id="playlist-content"></div>
        </div>

        <!-- Khung Player chính -->
        <div class="container">
            <div class="top-bar">
                <i class="fa-solid fa-list" id="playlist-btn" title="Playlist"></i>
                <span class="app-brand">CHILL & RELAX</span>
                <div class="top-actions">
                    <i class="fa-solid fa-moon" id="theme-toggle" title="Chuyển đổi Sáng/Tối"></i>
                    <i class="fa-solid fa-sliders" id="utility-btn" title="Tiện ích mở rộng"></i>
                </div>
            </div>

            <div class="player-visual">
                <div class="vinyl-needle" id="vinyl-needle">
                    <div class="needle-head"></div>
                    <div class="needle-arm"></div>
                    <div class="needle-base"></div>
                </div>
                <div class="vinyl-disc" id="vinyl-disc">
                    <div class="vinyl-grooves"></div>
                    <div class="vinyl-center" id="vinyl-center"></div>
                </div>
                <div class="player-img">
                    <img src="" class="active" id="cover">
                </div>
            </div>

            <div class="song-info-wrapper">
                <div class="song-text-area">
                    <h2 id="music-title"></h2>
                    <h3 id="music-artist"></h3>
                </div>
                <i class="fa-solid fa-heart favorite-btn-bottom" id="favorite-btn" title="Favorite"></i>
                
                <div class="visualizer" id="visualizer">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>

            <div class="player-progress" id="player-progress">
                <div class="progress" id="progress"></div>
            </div>
            <div class="music-duration">
                <span id="current-time">00:00</span>
                <span id="duration">00:00</span>
            </div>

            <div class="player-controls">
                <i class="fa-solid fa-shuffle" title="Shuffle" id="shuffle"></i>
                <i class="fa-solid fa-backward" title="Previous" id="prev"></i>
                <i class="fa-solid fa-play play-button" title="Play" id="play"></i>
                <i class="fa-solid fa-forward" title="Next" id="next"></i>
                <i class="fa-solid fa-repeat" title="Repeat" id="repeat"></i>
            </div>

            <div class="volume-container">
                <i class="fa-solid fa-volume-high" id="volume-icon" title="Mute/Unmute"></i>
                <div class="volume-slider-wrapper">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </div>

        <!-- Drawer Tiện ích mở rộng -->
        <div class="utility-drawer" id="utility-drawer">
            <div class="drawer-header">
                <h3>Tiện ích mở rộng</h3>
                <i class="fa-solid fa-xmark" id="close-utility"></i>
            </div>

            <div class="drawer-content">
                <div class="panel-section stats-section">
                    <h4><i class="fa-solid fa-chart-pie"></i> Thống kê & Bảng xếp hạng</h4>
                    <div class="stats-card">
                        <div class="stat-item">
                            <span>Hôm nay (<span id="current-profile-name">Trí</span>):</span>
                            <strong id="stat-today">0 giây</strong>
                        </div>
                        <div class="stat-item">
                            <span>7 ngày qua:</span>
                            <strong id="stat-week">0 giây</strong>
                        </div>
                        
                        <!-- Bảng xếp hạng Top 1, 2, 3 -->
                        <div class="ranking-board" id="ranking-board">
                            <!-- Render bằng Javascript -->
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h4>Tốc độ phát (Speed)</h4>
                    <div class="speed-options">
                        <button class="speed-btn" data-speed="0.75">0.75x</button>
                        <button class="speed-btn active" data-speed="1">1.0x</button>
                        <button class="speed-btn" data-speed="1.25">1.25x</button>
                        <button class="speed-btn" data-speed="1.5">1.5x</button>
                        <button class="speed-btn" data-speed="2">2.0x</button>
                    </div>
                </div>

                <div class="panel-section" style="margin-top: 15px;">
                    <h4>Hẹn giờ tắt nhạc (Sleep Timer)</h4>
                    <div class="timer-options">
                        <button class="timer-btn active" data-time="0">Tắt</button>
                        <button class="timer-btn" data-time="5">5 phút</button>
                        <button class="timer-btn" data-time="10">10 phút</button>
                        <button class="timer-btn" data-time="15">15 phút</button>
                        <button class="timer-btn" data-time="30">30 phút</button>
                        <button class="timer-btn" data-time="60">60 phút</button>
                    </div>
                    <p class="timer-status" id="timer-status">Chưa hẹn giờ</p>
                </div>
            </div>
        </div>
    </div>

    <canvas id="color-extractor" style="display:none;"></canvas>
    <script src="index.js"></script>
</body>

</html>
