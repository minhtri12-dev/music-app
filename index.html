<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/music.png">
    <title>MUSIC APP WITH MY FRIEND | BY NMT</title>
</head>
<body>

    <!-- Video & Ảnh nền gốc -->
    <video autoplay muted loop playsinline class="background-video" id="main-video">
        <source src="" type="video/mp4" id="video-source">
    </video>
    <img src="assets/1.jpg" class="background-img" id="main-bg" alt="Background">

    <!-- Lớp mờ và Canvas Hạt Đom Đóm / Mưa -->
    <div class="bg-overlay"></div>
    <canvas id="particle-canvas"></canvas>

    <!-- Toast Notifications -->
    <div id="zen-toast">GiAO DIỆN SẼ ẨN SAU 5s...</div>
    <div id="toast-container"></div>

    <div class="app-layout">
        
        <!-- Sidebar Drawer -->
        <div class="side-playlist" id="playlist-drawer">
            <div class="drawer-header">
                <h3>TrackList</h3>
            </div>
            
            <div class="filter-tabs">
                <button class="tab-btn active" data-tab="all" title="Tất cả"><i class="fa-solid fa-music"></i></button>
                <button class="tab-btn" data-tab="fav" title="Yêu thích"><i class="fa-solid fa-heart"></i></button>
                <button class="tab-btn" data-tab="history" title="Đã nghe gần đây"><i class="fa-solid fa-clock-rotate-left"></i></button>
                <button class="tab-btn" data-tab="settings" title="Cài đặt"><i class="fa-solid fa-sliders"></i></button>
            </div>

            <!-- Search Box -->
            <div class="search-box" id="search-box">
                <input type="text" id="search-input" placeholder="Tìm bài hát, ca sĩ...">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <!-- Các Tab Nội dung -->
            <div class="playlist-container active" id="playlist-content"></div>
            <div class="playlist-container" id="history-content"></div>

            <!-- Settings -->
            <div class="settings-container" id="settings-content">
                
                <!-- Mood Themes -->
                <h4><i class="fa-solid fa-palette"></i> TÂM TRẠNG (MOOD)</h4>
                <div class="setting-group mood-grid">
                    <button class="setting-btn theme-btn active" data-theme="auto">Tự động</button>
                    <button class="setting-btn theme-btn" data-theme="midnight">Midnight</button>
                    <button class="setting-btn theme-btn" data-theme="sunset">Sunset</button>
                    <button class="setting-btn theme-btn" data-theme="forest">Forest</button>
                    <button class="setting-btn theme-btn" data-theme="neon">Neon</button>
                    <button class="setting-btn theme-btn" data-theme="ocean">Ocean</button>
                    <button class="setting-btn theme-btn" data-theme="cherry">Cherry</button>
                    <button class="setting-btn theme-btn" data-theme="coffee">Coffee</button>
                    <button class="setting-btn theme-btn" data-theme="mono">Mono</button>
                </div>

                <!-- Hẹn giờ tắt -->
                <h4 style="margin-top: 25px;"><i class="fa-solid fa-stopwatch"></i> HẸN GIỜ TẮT (SLEEP TIMER)</h4>
                <div class="setting-group timer-grid">
                    <button class="setting-btn timer-btn active" data-time="0">Tắt</button>
                    <button class="setting-btn timer-btn" data-time="1">1m</button>
                    <button class="setting-btn timer-btn" data-time="5">5m</button>
                    <button class="setting-btn timer-btn" data-time="10">10m</button>
                    <button class="setting-btn timer-btn" data-time="15">15m</button>
                    <button class="setting-btn timer-btn" data-time="20">20m</button>
                    <button class="setting-btn timer-btn" data-time="25">25m</button>
                    <button class="setting-btn timer-btn" data-time="30">30m</button>
                    <button class="setting-btn timer-btn" data-time="60" style="grid-column: span 4;">60 Phút</button>
                </div>
                <div id="timer-display" class="timer-status">Chưa hẹn giờ</div>

                <!-- Custom Background -->
                <h4 style="margin-top: 25px;"><i class="fa-solid fa-image"></i> HÌNH NỀN TÙY CHỈNH (CUSTOM BACKGROUND)</h4>
                <div class="search-box" style="padding: 0; margin-bottom: 12px;">
                    <input type="text" class="custom-input" id="custom-bg-input" placeholder="Dán link ảnh/video...">
                </div>
                
                <!-- Input ẩn để Tải ảnh từ máy -->
                <input type="file" id="custom-bg-upload" accept="image/*" style="display: none;">
                
                <div class="setting-group" style="display: flex; gap: 8px;">
                    <button class="setting-btn action-btn" id="apply-bg-btn" style="flex: 1.2;" title="Dán link">Dán Link</button>
                    <button class="setting-btn action-btn" id="upload-bg-btn" style="flex: 1.5;" title="Tải ảnh từ máy tính"><i class="fa-solid fa-upload"></i> Tải ảnh</button>
                    <button class="setting-btn danger-btn" id="reset-bg-btn" style="flex: 1;" title="Xóa nền bài này">Xóa</button>
                </div>
            </div>
        </div>

        <!-- Main Player -->
        <div class="glass-player">
            <div class="top-row">
                <div class="top-left">
                    <i class="fa-solid fa-list-ul" id="playlist-toggle-btn" title="Toggle list"></i>
                </div>
                <div class="top-center">
                    <span class="app-brand">Chill & Relax</span>
                </div>
                <div class="top-right">
                    <span id="track-count">TRACK 1 OF 24</span>
                </div>
            </div>
            
            <div class="center-info">
                <!-- Đĩa Kính Pha Lê -->
                <div class="modern-cd" id="cd-element">
                    <div class="cd-hole"></div>
                </div>
                <h1 class="song-title" id="music-title">Song Title</h1>
                <div class="artist" id="music-artist">Artist Name</div>
                <div class="visualizer" id="visualizer-bars">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="bottom-area">
                <div class="player-progress-container">
                    <span id="current-time">0:00</span>
                    <div class="player-progress" id="player-progress">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>

                <div class="controls-row">
                    <div class="main-controls">
                        <i class="fa-solid fa-shuffle" id="shuffle" title="Shuffle"></i>
                        <i class="fa-solid fa-backward-step" id="prev" title="Previous"></i>
                        <div class="play-btn-wrapper" id="play-btn-wrapper">
                            <i class="fa-solid fa-play" id="play" title="Play"></i>
                        </div>
                        <i class="fa-solid fa-forward-step" id="next" title="Next"></i>
                        <i class="fa-solid fa-repeat" id="repeat" title="Repeat"></i>
                    </div>
                    
                    <div class="volume-control">
                        <i class="fa-solid fa-volume-high" id="volume-icon" title="Mute/Unmute"></i>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
