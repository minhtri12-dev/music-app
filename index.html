<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/music.png">
    <title>MUSIC APP WITH MY FRIEND | BY NMT</title>
</head>
<body>

    <!-- Thay đổi từ <img> thành <video> để chạy file 8.mp4 -->
    <video autoplay muted loop playsinline class="background-video" id="main-video">
        <source src="assets/1.jpg" type="video/mp4" id="video-source">
    </video>
    
    <!-- Hoặc dùng thẻ image dự phòng nếu bài là ảnh tĩnh -->
    <img src="assets/1.jpg" class="background-img" id="main-bg" alt="Background">

    <div class="app-layout">
        
        <!-- Drawer Kho Nhạc -->
        <div class="side-playlist" id="playlist-drawer">
            <div class="drawer-header">
                <h3>Menu</h3>
            </div>
            
            <div class="filter-tabs">
                <button class="tab-btn active" data-tab="all" title="Tất cả bài hát"><i class="fa-solid fa-music"></i></button>
                <button class="tab-btn" data-tab="fav" title="Yêu thích"><i class="fa-solid fa-heart"></i></button>
                <button class="tab-btn" data-tab="settings" title="Cài đặt"><i class="fa-solid fa-gear"></i></button>
            </div>

            <div class="playlist-container active" id="playlist-content"></div>

            <div class="settings-container" id="settings-content">
                <h4><i class="fa-solid fa-gauge-high"></i> Tốc độ phát</h4>
                <div class="setting-group">
                    <button class="speed-btn active" data-speed="1">1x</button>
                    <button class="speed-btn" data-speed="1.25">1.25x</button>
                    <button class="speed-btn" data-speed="1.5">1.5x</button>
                    <button class="speed-btn" data-speed="2">2x</button>
                </div>

                <h4 style="margin-top: 10px;"><i class="fa-solid fa-stopwatch"></i> Hẹn giờ tắt (Phút)</h4>
                <div class="setting-group timer-grid">
                    <button class="timer-btn active" data-time="0">Tắt</button>
                    <button class="timer-btn" data-time="5">5</button>
                    <button class="timer-btn" data-time="10">10</button>
                    <button class="timer-btn" data-time="15">15</button>
                    <button class="timer-btn" data-time="20">20</button>
                    <button class="timer-btn" data-time="25">25</button>
                    <button class="timer-btn" data-time="30">30</button>
                    <button class="timer-btn" data-time="60">60</button>
                </div>
                <div id="timer-display" class="timer-status">Chưa hẹn giờ</div>
            </div>
        </div>

        <div class="glass-player">
            <div class="top-row">
                <div class="top-left">
                    <i class="fa-solid fa-list-ul" id="playlist-toggle-btn" title="Đóng/Mở danh sách"></i>
                </div>
                <div class="top-center">
                    <span class="app-brand">Chill & Relax</span>
                </div>
                <div class="top-right">
                    <span id="track-count">TRACK 1 OF 13</span>
                </div>
            </div>
            
            <div class="center-info">
                <div class="modern-cd" id="cd-element">
                    <div class="cd-hole"></div>
                </div>
                <h1 class="song-title" id="music-title">Song Title</h1>
                <div class="artist" id="music-artist">Artist Name</div>
                <div class="visualizer" id="visualizer-bars">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="bottom-area">
                <div class="player-progress-container">
                    <span id="current-time">0:00</span>
                    <div class="player-progress" id="player-progress">
                        <div class="progress" id="progress"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>

                <div class="controls-row">
                    <div class="main-controls">
                        <i class="fa-solid fa-shuffle" id="shuffle" title="Shuffle"></i>
                        <i class="fa-solid fa-backward-step" id="prev" title="Previous"></i>
                        <div class="play-btn-wrapper" id="play-btn-wrapper">
                            <i class="fa-solid fa-play" id="play" title="Play"></i>
                        </div>
                        <i class="fa-solid fa-forward-step" id="next" title="Next"></i>
                        <i class="fa-solid fa-repeat" id="repeat" title="Repeat"></i>
                    </div>
                    
                    <div class="volume-control">
                        <i class="fa-solid fa-volume-high" id="volume-icon"></i>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="hidden-elements" style="display: none;"></div>
    <script src="index.js"></script>
</body>
</html>
